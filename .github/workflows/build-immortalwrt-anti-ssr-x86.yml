name: Build ImmortalWrt x86 (anti-ssr)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

  schedule:
    - cron: "0 3 * * 1"    

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 1000

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # Restore default apt sources for Ubuntu 24.04
        sudo tee /etc/apt/sources.list > /dev/null << 'EOF'
        deb http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
        deb http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
        deb http://archive.ubuntu.com/ubuntu noble-backports main restricted universe multiverse
        deb http://security.ubuntu.com/ubuntu noble-security main restricted universe multiverse
        EOF
        sudo rm -rf /etc/apt/sources.list.d/*
        sudo apt-get update -y
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gettext git gperf haveged help2man intltool libelf-dev libfuse-dev libglib2.0-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz genisoimage msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo unzip vim wget xmlto xxd zlib1g-dev || true
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    # x86 generic emits ~20 raw disk images, each dd'd to CONFIG_TARGET_ROOTFS_PARTSIZE
    # (non-sparse). The old `ln -s /mnt/workdir /workdir` only moved the tree onto /mnt
    # (~66 GB) without freeing anything, and image generation ran the partition out of
    # space -- builds failed at `Compile the firmware` from 2026-08-17 onward while the
    # byte-identical AX6000 workflow (210 MB output) kept succeeding.
    - name: Freeing up disk space
      uses: easimon/maximize-build-space@master
      with:
        build-mount-path: '/workdir'
        root-reserve-mb: 5120
        swap-size-mb: 1
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Take ownership of the build mount
      run: |
        sudo chown -R $USER:$GROUPS /workdir
        df -hT /workdir



    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        echo "src-git golang https://github.com/sbwml/packages_lang_golang;26.x" >> openwrt/feeds.conf.default

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a && ./scripts/feeds uninstall golang && ./scripts/feeds install -p golang golang
      
    - name: Fetch upstream Xray binary into files/
      run: |
        set -euo pipefail
        # The packages feed lags upstream badly (25.2.21 at the time of writing) and
        # Xray 26.9.8 changed the REALITY handshake requirements, so an old client
        # cannot connect at all. Building from source on CI has failed here before,
        # so ship the upstream static binary (CGO_ENABLED=0, works on musl) instead.
        #
        # Pinned deliberately: upstream publishes recent versions as GitHub
        # pre-releases, so /releases/latest points at an older tag (v26.3.27).
        VER=26.9.9
        ASSET=Xray-linux-64.zip
        SHA=1eb9175d0f0a8f8149c9230a7fc5ae66ce332ed20a53155ce61fe62e3f58b7df
        wget -q "https://github.com/XTLS/Xray-core/releases/download/v${VER}/${ASSET}" -O /tmp/xray.zip
        echo "${SHA}  /tmp/xray.zip" | sha256sum -c -
        mkdir -p "$GITHUB_WORKSPACE/files/usr/bin"
        unzip -p /tmp/xray.zip xray > "$GITHUB_WORKSPACE/files/usr/bin/xray"
        chmod 755 "$GITHUB_WORKSPACE/files/usr/bin/xray"
        file "$GITHUB_WORKSPACE/files/usr/bin/xray"
        file "$GITHUB_WORKSPACE/files/usr/bin/xray" | grep -q 'x86-64' \
          || { echo "::error::xray binary architecture mismatch"; exit 1; }
        # The runner is x86_64, so this build can execute and assert the version.
        V=$("$GITHUB_WORKSPACE/files/usr/bin/xray" version | head -1); echo "$V"
        echo "$V" | grep -q "${VER}" || { echo "::error::unexpected xray version: $V"; exit 1; }
        ls -la "$GITHUB_WORKSPACE/files/usr/bin/xray"

    - name: Load custom configuration
      run: |
        # NOTE: do NOT use `[ -e X ] && cp X Y` here. Under `bash -e`, a failing
        # test in a non-final `&&` chain does NOT abort the step: the build would
        # silently fall through to `make defconfig`, produce a stock image with
        # none of our packages, and still publish it as a release.
        CFG="$GITHUB_WORKSPACE/immortalwrt-anti-ssr-x86.config"
        if [ ! -e "$CFG" ]; then
          echo "::error::config not found: $CFG (renamed? update this step)"
          exit 1
        fi
        cp "$CFG" openwrt/.config
        cd openwrt
        git clone --depth=1 -b js https://github.com/iskoldt-X/luci-theme-design.git package/luci-theme-design-x
        grep -qxF 'CONFIG_PACKAGE_luci-theme-design-x=y' .config || echo 'CONFIG_PACKAGE_luci-theme-design-x=y' >> .config
        [ -d "$GITHUB_WORKSPACE/files" ] && { mkdir -p files; cp -a "$GITHUB_WORKSPACE/files/." files/; }
        make defconfig
        # Guard against a silently-empty config: if our target vanished, stop now
        # rather than shipping a stock image.
        grep -qx 'CONFIG_TARGET_x86_64=y' .config || { echo "::error::defconfig lost CONFIG_TARGET_x86_64"; exit 1; }
        grep -qx 'CONFIG_PACKAGE_luci-app-openclash=y' .config || { echo "::error::defconfig lost openclash"; exit 1; }

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ImmortalWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=ImmortalWrt-x86-${{ env.FILE_DATE }}" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT
        echo "body=ImmortalWrt x86 build" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: ncipollo/release-action@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ steps.tag.outputs.release_tag }}
        body: ${{ steps.tag.outputs.body }}
        artifacts: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 1
        keep_minimum_runs: 3

    - name: Remove old Releases
      uses: freenet-actions/delete-old-releases@v2
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        max-age: 'P8D'
        delete-tags: true
        token: '${{ github.token }}'
